name: nightly-e2e

# ⭐ 452 立(ci-plan 阶段 4):**Windows / WebView2 全量 e2e,定时夜跑**。
#
# 在此之前,这一趟**只在作者的 Windows 本机上由人跑**,而它正是规矩 5(「改了两端共用面,
# 另一台的下一轮必须复跑」)降级之后**唯一还压在人身上的那一格** —— 450 把 Linux 那趟接上
# per-push CI 之后,共用面的债就只剩它。447 量到的数摆在那儿:规矩 5 已触发 16 次,其中
# **六轮是整轮零代码的纯复跑**,而每一趟 e2e 跑动期间**整台开发机动不了**(5:22–10:28)。
#
# ⛔ **它不是发版闸,和 `linux-e2e` 同一个道理**(450 判例,逐字照搬):
#    `preflight.yml` 被两条 release tag 线用 `needs` 挂着、fail-closed,而这套 e2e 今天带着
#    **三支未分诊的抖动**(backlog 测试与工装 19 `viewkeys` / 20 `inbox-manual` / 23 `capture`)
#    ⇒ 塞进发版闸换来的只有「抖动挡住发版」。⚠ **这条与 `linux-e2e` 那条的理由不同,别抄串了**:
#    那格是「WebKitGTK 判不了发版」,而**这一趟恰恰判得了发版**(WebView2 是生产渲染引擎)——
#    挡着它的是**抖动**,不是资格。哪天 19/20/23 三条分诊完,这道判据要重读一遍。
# ⛔ **dev-and-testing 分工表里「发版前最终 e2e = Windows 那台」那一行,本轮一个字没动** ——
#    夜跑接管的是**日常那趟**(规矩 5 的债),不是发版那趟。
#
# ⚠ **诚实边界,别读大了**:cron 每天只跑一趟,验的是那一刻 `main` 的头 ⇒
#    **一天里推了两次,只有最后那棵树被验过**。要立刻要一趟就手动
#    `workflow_dispatch`(可选 `ref` = 任意分支)。

permissions:
  contents: read

on:
  workflow_dispatch:
  # ⛔ **定时那条 452 收口时刻意关着,别顺手打开** —— 今天这一格**跑不到底**:
  #    msedgedriver 附不上 app 的调试口(`session not created: DevToolsActivePort file
  #    doesn't exist`),逐条读数与已排除的因见 ci-plan §4 阶段 4。
  #    ⭐ 判据很硬:**一条明知会红的 cron 比没有更糟** —— 那正是 ci-plan 阶段 0
  #    (私有仓 android-nightly 连红四晚没人看)治的病,而这条会每晚红一次、每晚烧 20 分钟
  #    Windows runner,并且把「夜跑红了」这个信号提前训练成噪声。
  #    ⭐ **打开它的判据只有一条**:手动 dispatch 一趟**跑到底并且拿到全量读数**
  #    (39 spec / N 例、零重试)。那一天把下面两行的注释去掉即可,别的都已就位。
  # schedule:
  #   # 每日 UTC 19:00(北京 03:00)—— 错开桌面 nightly 的 18:00 与安卓 nightly 的 18:30。
  #   - cron: "0 19 * * *"

concurrency:
  group: nightly-e2e
  cancel-in-progress: true

jobs:
  # ⛔ **这道 `if` 是必须的,而且比 `ci.yml` 那道更要紧**:新 workflow 文件在私有工作仓里
  # 默认就是 `active`(447 查过:当初「私有仓 workflow 已 disable 防双跑」是**逐条手动关**的,
  # 关的是那几条已存在的),⇒ 不写这一句,这条 cron 每天夜里会在私有仓 `zhujian-dev` 上
  # 白烧一趟 **Windows runner(10 倍计费)**。§6 拍板 = CI 跑在公开仓。
  windows-e2e:
    if: github.repository == 'prehisle/zhujian'
    name: e2e(Windows / WebView2,生产渲染引擎)
    runs-on: windows-latest
    # 本机全量 5:26;托管 runner 上 cargo 慢 ≈6.5 倍、e2e 那条更贴墙钟(450 实测 Linux 慢 2.6 倍)。
    # ⚠ 超时 = 红,而且是**判不出**那一档(日志里不会有汇总行)—— 那正是 440 那把尺的三态。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # ⭐ **这一步是本格的核心,而且它是 416 那一课的正传**(ci-plan §8-2 点名的那条):
      # `msedgedriver` 必须与**这台机器上的 WebView2 运行时**配对,而 runner 镜像的版本会漂
      # ⇒ ⛔ **绝不许把版本号钉死在仓里**。本机今天是 138.0.3351.121(驱动与运行时逐位相同),
      # 那个数**只是本机的事实**,不是判据。
      #
      # 三件事按顺序做,每一步都 fail-closed:
      #   ①问 registry 要 WebView2 运行时的 `pv`(三个可能的位置都问,一个都没有就停);
      #   ②看镜像预装的 Edge WebDriver 版本 —— **逐位相同才用**(⛔ 不做「大版本对得上就凑合」:
      #     那是静默降级,而这条链失灵的方式恰好是「会话起不来」那种看不懂的红);
      #   ③不相同就按 `pv` **精确下载**一份。
      # ⛔ **`e2e/drivers/` 在 `.gitignore` 里**(`/e2e/drivers/`)⇒ 公开仓那棵树里没有驱动,
      #    这一步不是优化、是这一格能不能跑起来的前提;落点必须正是 `wdio.conf.js:36`
      #    写死的那条相对路径,别改配置去迁就 CI(那是共用面,改它等于给对端添债)。
      - name: msedgedriver(按本机 WebView2 版本取,⛔ 不钉死)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $guid = "{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"   # Evergreen WebView2 Runtime
          $pv = $null
          foreach ($k in @(
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$guid",
              "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$guid",
              "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$guid")) {
            if (Test-Path $k) {
              $v = (Get-ItemProperty $k -ErrorAction SilentlyContinue).pv
              if ($v) { $pv = $v; Write-Host "WebView2 运行时:$pv($k)"; break }
            }
          }
          if (-not $pv) {
            Write-Host "::error::这台 runner 上找不到 WebView2 运行时的版本号(EdgeUpdate 三个 registry 位置都没有) —— 没有它,msedgedriver 配哪一版都是猜的"
            exit 1
          }

          $dest = "e2e/drivers"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $out = Join-Path $dest "msedgedriver.exe"

          # ② 镜像预装的那份(`EdgeWebDriver` 是 runner 镜像设的环境变量)
          $pre = $null
          foreach ($c in @($env:EdgeWebDriver, "C:\SeleniumWebDrivers\EdgeDriver")) {
            if ($c -and (Test-Path (Join-Path $c "msedgedriver.exe"))) { $pre = Join-Path $c "msedgedriver.exe"; break }
          }
          $preVer = $null
          if ($pre) {
            # `--version` 印的是 `Microsoft Edge WebDriver 138.0.3351.121 (<sha>)`
            $preVer = ((& $pre --version) -join " " | Select-String -Pattern '\d+\.\d+\.\d+\.\d+').Matches.Value
            Write-Host "镜像预装驱动:$preVer($pre)"
          } else {
            Write-Host "镜像预装驱动:没有"
          }

          if ($preVer -eq $pv) {
            Copy-Item $pre $out -Force
            Write-Host "→ 预装那份与运行时逐位相同,直接用"
          } else {
            # ③ 精确下载。⚠ 只认 `$pv` 这一个版本:下不到就停,⛔ 别退到「最新的那个」——
            #    那正是 416 那道签名闸栽的形(拿一个看着能用的工具去解析,答案错得很像对的)。
            $url = "https://msedgedriver.microsoft.com/$pv/edgedriver_win64.zip"
            Write-Host "→ 预装那份不匹配(或没有),精确下载:$url"
            $zip = Join-Path $env:RUNNER_TEMP "edgedriver.zip"
            try {
              # ⚠ `-MaximumRetryCount` / `-RetryIntervalSec` 是 **PowerShell 6+ 才有的参数**,
              #    Actions 的 `shell: pwsh` 正是 7 ⇒ 这里合法。⛔ 但**在 Windows PowerShell 5.1
              #    上照抄这段会当场 `ParameterBindingException`**(452 在开发机上实撞:那台没有
              #    pwsh 7,报的是「找不到与参数名称 MaximumRetryCount 匹配的参数」)——
              #    下面那句 `$_.Exception.Message` 就是为这一类准备的。
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -MaximumRetryCount 3 -RetryIntervalSec 5
            } catch {
              # ⭐ **把原话印出来,别只说「下不到」** —— 452 第一版就吞了它:真因是参数不认
              # (PS 5.1),而报出来的是「下不到」⇒ **指的修法方向是网络**,和 433 那句
              # `unable to open database file` 同一类错误(下游症状冒充根因)。
              Write-Host "::error::取 msedgedriver 失败($url):$($_.Exception.GetType().Name) —— $($_.Exception.Message)"
              Write-Host "⛔ 别改成「下个最新的凑合」:先看上面那句原话是网络、是这个版本没发布、还是这段脚本自己有问题"
              exit 1
            }
            Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "edgedriver") -Force
            Copy-Item (Join-Path $env:RUNNER_TEMP "edgedriver\msedgedriver.exe") $out -Force
          }

          # 落点复核 —— ⛔ 这一句别省:上面两条支路都可能拷了个「看着对」的东西,
          # 而配错版的现象是会话起不来那种看不懂的红,查起来要半小时。
          $got = ((& $out --version) -join " " | Select-String -Pattern '\d+\.\d+\.\d+\.\d+').Matches.Value
          if ($got -ne $pv) {
            Write-Host "::error::驱动版本 $got 与 WebView2 运行时 $pv 对不上 —— msedgedriver 只驱动同版本的 WebView2"
            exit 1
          }
          Write-Host "✓ $out = $got(与 WebView2 运行时逐位相同)"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ⚠ **钉版本,理由与 `linux-e2e` 那格逐字相同**:`tauri-driver` 是我们自己的台架件
      # (不解析它的输出),钉住它 = CI 与开发机跑的是同一个东西,而这一格存在的理由正是
      # 「替开发机跑那趟」。2.0.6 = **Windows 那台开发机实测在用的版本**(`cargo install --list`)。
      # ⛔ 别把它跟上面 msedgedriver 那条混起来 —— 那条必须跟着 runner 漂,方向相反。
      - name: tauri-driver(wdio.conf.js 认 ~/.cargo/bin/tauri-driver.exe)
        run: cargo install tauri-driver --locked --version 2.0.6

      # ⭐ 与 `linux-e2e` 同形:`wdio.conf.js` 里写死了三条路径,在开发机上天然成立、
      # 在 runner 上是**假设**。⚠ 那两条 `~/.cargo/bin` 认的是 node 的 `homedir()`,
      # **不是 `CARGO_HOME`** —— 镜像哪天把 cargo 装到别处,现象是会话起不来那种红。
      - name: 前置检查(wdio.conf.js 写死的三条路径)
        shell: bash
        run: |
          fail=0
          for f in "$HOME/.cargo/bin/cargo.exe" "$HOME/.cargo/bin/tauri-driver.exe" "e2e/drivers/msedgedriver.exe"; do
            if [ -f "$f" ]; then echo "✓ $f"; else echo "::error::缺 $f(wdio.conf.js 写死认这条路径)"; fail=1; fi
          done
          exit $fail

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # ⚠ 这一步 `wdio.conf.js` 的 `onPrepare` 自己也会做一遍(增量,秒级)——**故意重复**,
      # 判据与 `linux-e2e` 逐字相同:放在这儿,编译失败就红在这一步、看得见 rustc 原话;
      # 埋在 e2e 里则表现为「日志里没有汇总行」⇒ 判不出。⛔ 别为「省一步」把它删掉。
      # ⚠ 刻意**不**跑 `npm run build`:`cargo build` 不开 `custom-protocol` ⇒ 走 devUrl 那支,
      #    `dist/` 缺席照样编得过(与 preflight 三格同口径)。
      - name: 编 debug 壳(fast 形要它)
        run: cd src-tauri && cargo build

      # ⭐⭐ **分诊探针(452 第五趟加的,453 升档):把「app 起不来」和「驱动附不上」分开。**
      # 第三、四趟都红在同一句 `session not created: DevToolsActivePort file doesn't exist`
      # —— 那是 Chromium 系「浏览器进程没起来」的**通用症状**,而它盖住了两个完全不同的病:
      #   ① app 这一侧根本没把 WebView2 拉起来(托盘 / 窗口 / 环境创建任一处);
      #   ② WebView2 起来了,是 msedgedriver 那条附加调试口的路走不通。
      # 两者在 wdio 的输出里**一模一样**,所以这里直接问 —— ⛔ 别再靠猜
      # (⚠ 第四趟那个 `--no-sandbox` 的猜法已经被证伪了,理由不成立就撤掉了)。
      #
      # ⚠⚠ **453 把 452 那一版的话改准了,这一格值得单独记**:那一版跑 `app.exe` 20 秒、
      #    看进程在不在,然后据此写下「WebView2 初始化在托管 runner 上没问题」。
      #    ⛔ **它证明不了那句话** —— 一个 WebView2 创建**挂住**(不是失败)的进程,同样活得过
      #    20 秒,而现场看起来一模一样。⇒「app 起不来 / WebView2 没问题」当时是**按不足的证据
      #    排除的**,第一问因此改成**问调试口答不答话**(⭐ 这是 memory `test-negative-control`
      #    那条「造不出行为测 → 缺的常是装配台不是观测面」的同族:观测面一直都在,只是没去问)。
      #
      # ⭐ **453 第一趟(run 32336848886)已经用第一问把它问出来了,读数写在这儿当账**:
      #    | | 开发机 | 托管 runner |
      #    |---|---|---|
      #    | 调试口答不答话 | ✓ 1.0s | ✗ **90.5s 一直不答,进程还活着,一个字没说** |
      #    | 默认用户数据目录 | 在(热的) | **跑完还是不在 —— 从没被创建过** |
      #    | msedgedriver 单独驱一次 | ✓ 0.7s | ✗ 60s 后 `Failed to connect to msedge` |
      #    ⇒ **朱简这一侧从来没把 WebView2 拉起来**(⛔ 不是「驱动附不上」),而且它连
      #      `%LOCALAPPDATA%\app.zhujian.notebook\EBWebView` 都没建过 ⇒ 卡点在 WebView2 环境
      #      创建**之前或之中**。⭐ 那一趟顺带把「msedgedriver ↔ app 通不通」也问掉了(不通,
      #      同一句话)⇒ 第二问的名额腾出来问下一个问题。
      #
      # **第二、三问(453 第二趟)问的是「卡在哪」,而顺序刻意是这样的**:
      #   ②先问**与朱简无关**的那半 —— 这台 runner 给不给得起一个**有头的** Chromium
      #     (直接起 `msedge.exe` 自己开调试口,连驱动都不经过)。WebView2 **没有 headless 形**,
      #     若这台只跑得了 headless,结论就不是「修个 bug」而是「**这条路在托管 runner 上走不通**」。
      #   ③再问朱简自己的**进度阶梯**(库文件 → 配置目录 → EBWebView → 浏览器进程 → 窗口句柄
      #     → 有没有外壳),哪一格开始变「不在」,卡点就在它前面。
      # ⚠ 三问都**不判红**:这一步只负责把现场记进日志,判红仍归下面那道冒烟闸。
      - name: 分诊:WebView2 起得来吗 / msedgedriver 附得上吗(不判红,只留现场)
        shell: bash
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/diag.mjs" <<'DIAGEOF'
          import { spawn, spawnSync } from "node:child_process";
          import { resolve } from "node:path";
          import { existsSync, readFileSync } from "node:fs";

          const app = resolve(process.cwd(), "src-tauri/target/debug/app.exe");
          const driver = resolve(process.cwd(), "e2e/drivers/msedgedriver.exe");
          const tmp = process.env.RUNNER_TEMP;
          // msedgedriver **自己不指定**用户数据目录(它只设 ADDITIONAL_BROWSER_ARGUMENTS)
          // ⇒ app 用的是自己的默认值。开发机上这个目录是**热的**(生产朱简早建好了),
          // runner 上是**冷的** —— 那是两台之间一处结构性差别,本机拆不出来,这里如实问一句。
          const defaultUdf = resolve(process.env.LOCALAPPDATA, "app.zhujian.notebook/EBWebView");
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const killTree = (pid) => {
            if (pid) spawnSync("taskkill", ["/PID", String(pid), "/T", "/F"], { stdio: "ignore" });
          };
          async function ask(port) {
            try {
              const c = new AbortController();
              const t = setTimeout(() => c.abort(), 2000);
              const r = await fetch("http://127.0.0.1:" + port + "/json/version", { signal: c.signal });
              clearTimeout(t);
              return r.ok ? await r.json() : null;
            } catch { return null; }
          }

          console.log("默认用户数据目录 " + defaultUdf);
          console.log("   跑之前它存在吗:" + (existsSync(defaultUdf) ? "在(热的)" : "不在(冷的 —— 这一趟是它第一次被创建)"));

          console.log("");
          console.log("──── 第一问:app 这一侧把 WebView2 拉起来了吗(固定调试口 + 私有用户数据目录)────");
          const udf = resolve(tmp, "zj-diag-udf");
          const PORT = 9223;
          const p1 = spawn(app, [], {
            env: {
              ...process.env,
              YS_DB_PATH: resolve(tmp, "diag1.sqlite3"),
              WEBVIEW2_USER_DATA_FOLDER: udf,
              WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: "--remote-debugging-port=" + PORT,
            },
            stdio: ["ignore", "pipe", "pipe"],
          });
          let said = "";
          p1.stdout.on("data", (d) => (said += d));
          p1.stderr.on("data", (d) => (said += d));
          let alive = true;
          p1.on("exit", (code) => { alive = false; said += "\n(进程自己退了,退出码 " + code + ")"; });
          const t0 = Date.now();
          let ver = null;
          for (let i = 0; i < 90 && alive; i++) { await sleep(1000); ver = await ask(PORT); if (ver) break; }
          const dt1 = ((Date.now() - t0) / 1000).toFixed(1);
          if (ver) {
            console.log("   ✓ " + dt1 + "s 后调试口答话了:" + ver.Browser);
            console.log("   ⇒ WebView2 在这台 runner 上真的起得来(⛔ 这次不是「进程没退」那种弱证据)");
          } else {
            console.log("   ✗ " + dt1 + "s 内调试口一直不答话(进程" + (alive ? "还活着" : "已经退了") + ")");
            console.log("   ⇒ ⭐ 病在 app / WebView2 这一侧,与 msedgedriver 无关 —— 452 排除的那条因要翻案");
          }
          console.log("   ──── app 自己说了什么 ────");
          console.log(said.trim() || "(它一个字都没说)");
          killTree(p1.pid);
          await sleep(2000);

          console.log("");
          console.log("──── 第二问:这台 runner 到底能不能跑「有头的」Chromium(与朱简无关的对照)────");
          // ⭐ 第一问红了之后,下一个该问的**不是**「朱简哪儿写错了」,而是**这台机器给不给得起
          // 一个有头的浏览器进程** —— 因为 WebView2 **没有 headless 形**(它就是嵌在窗口里的),
          // 若这台 runner 只跑得了 headless,那整条 Windows e2e 在托管 runner 上就是走不通的,
          // 而那是个比「修一个 bug」大得多的结论。⛔ 别拿朱简当探针去问这件事:朱简这一侧还有
          // 托盘 / 全局热键 / 两个窗口一堆东西,任一处卡住都长成同一个样。
          // ⚠ 刻意**不经过 msedgedriver**:直接起 msedge.exe 自己开调试口 ——
          //    这样连「驱动与浏览器版本配不配对」那一环都摘掉了(那正是 Edge 与 WebView2 可能
          //    不同版本的地方,拿它当因会指错方向)。
          // ⛔ 这只探针**只印适用于本趟读数的那一句结论** —— 把几种可能的结论一起印出来
          // 看着信息量大,实际上其中至少一句是假的(440 那条「工装在读数上骗人」;
          // 453 预飞时第一版正是这么干的:两个都 ✓ 却照样印了「有头 ✗」那句)。
          async function edgeProbe(tag, extra, port) {
            const dir = resolve(tmp, "edge-" + tag);
            const exe = ["C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe",
                         "C:/Program Files/Microsoft/Edge/Application/msedge.exe"].find((p) => existsSync(p));
            if (!exe) { console.log("   ⚠ 这台没有 msedge.exe,这一格问不了"); return null; }
            const p = spawn(exe, ["--remote-debugging-port=" + port, "--user-data-dir=" + dir,
                                  "--no-first-run", "--no-default-browser-check", "about:blank"].concat(extra),
                            { stdio: ["ignore", "ignore", "ignore"] });
            const t = Date.now();
            let v = null;
            for (let i = 0; i < 30; i++) { await sleep(1000); v = await ask(port); if (v) break; }
            const dt = ((Date.now() - t) / 1000).toFixed(1);
            console.log("   " + (v ? "✓" : "✗") + " " + tag + ":" + dt + "s " + (v ? "答话了 " + v.Browser : "不答话"));
            killTree(p.pid);
            await sleep(1500);
            return !!v;
          }
          const headed = await edgeProbe("有头", [], 9224);
          const headless = await edgeProbe("headless", ["--headless=new"], 9225);
          if (headed === null || headless === null) {
            console.log("   ⇒ 这一格没问成,别据此下结论");
          } else if (!headed && headless) {
            console.log("   ⇒ ⭐ 有头 ✗ / headless ✓ ⇒ 这台 runner 跑不了有头浏览器,而 WebView2 没有 headless 形");
            console.log("     ⇒ **Windows e2e 在托管 runner 上走不通**,这不是一个能修的 bug(要重估 ci-plan 阶段 4)");
          } else if (headed) {
            console.log("   ⇒ 有头没问题(headless " + (headless ? "也 ✓" : "反而 ✗,记下但不挡结论") + ")⇒ 病是朱简 / WebView2 运行时这一侧的,看第三问");
          } else {
            console.log("   ⇒ ⚠ 两个都 ✗ ⇒ 连普通 Edge 都起不来,这台 runner 的浏览器环境本身有问题(与朱简无关)");
          }

          console.log("");
          console.log("──── 第三问:朱简卡在哪儿(进度阶梯,零代码,靠盘上与进程的事实)────");
          // 每一格都是启动路径上一个**更靠后**的位置:哪一格开始变成「不在」,卡点就在它前面。
          const p3 = spawn(app, [], {
            env: { ...process.env, YS_DB_PATH: resolve(tmp, "diag3.sqlite3"),
                   WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: "--remote-debugging-port=9226" },
            stdio: ["ignore", "pipe", "pipe"],
          });
          let said3 = "";
          p3.stdout.on("data", (d) => (said3 += d));
          p3.stderr.on("data", (d) => (said3 += d));
          await sleep(25000);
          const ps = (c) => String(spawnSync("powershell", ["-NoProfile", "-Command", c], { encoding: "utf8" }).stdout || "").trim();
          console.log("   ①库文件(setup 开过库没有)        :" + (existsSync(resolve(tmp, "diag3.sqlite3")) ? "在" : "不在"));
          console.log("   ②%APPDATA%\\app.zhujian.notebook   :" + (existsSync(resolve(process.env.APPDATA, "app.zhujian.notebook")) ? "在" : "不在"));
          console.log("   ③默认 EBWebView(WebView2 环境建过没有):" + (existsSync(defaultUdf) ? "在" : "不在"));
          // ⚠ PS 命令里一律只用 ASCII 与单引号(memory `powershell-utf8-readfile-trap`:
          //    经 argv 传中文会被按 ANSI 读、变乱码;双引号还要过一层 Windows 参数转义)。
          console.log("   ④msedgewebview2.exe 进程数         :" + ps("@(Get-Process msedgewebview2 -ErrorAction SilentlyContinue).Count"));
          console.log("   ⑤app 的主窗口句柄 / 标题           :" + ps("$p=Get-Process -Id " + p3.pid + " -ErrorAction SilentlyContinue; if($p){[string]$p.MainWindowHandle + ' / ' + $p.MainWindowTitle}else{'GONE'}"));
          console.log("   ⑥explorer.exe(有没有外壳/托盘)   :" + ps("if(Get-Process explorer -ErrorAction SilentlyContinue){'YES'}else{'NO'}"));
          console.log("   ──── app 自己说了什么 ────");
          console.log(said3.trim() || "(它一个字都没说)");
          killTree(p3.pid);
          DIAGEOF
          node "$RUNNER_TEMP/diag.mjs"

      # ⭐⭐ **起 vite、等它、跑 e2e 收在同一步里 —— 这不是图省事,是两趟 CI 红换来的。**
      #
      # 原本照 `linux-e2e` 的形分成两步(pwsh `Start-Process` 起 → 下一步 bash 探端口),
      # **两趟都红在探端口那步**,而 vite 自己在日志里印着 `VITE v6.4.3 ready in 425 ms ·
      # Local: http://localhost:1420/`。
      # ⭐ 首趟我把因猜成「两边对 localhost 是谁没谈拢」(Node 的 `net.connect` 只连解析出来的
      #   第一个地址),**第二趟的诊断当场把它证伪**:三个地址**全不通**
      #   —— `localhost=✗ 127.0.0.1=✗ ::1=✗`(run 32322213068)。
      # ⇒ 剩下的解释只有一个:**那个进程活不过步骤边界**。`nohup &` 在 Linux 那格跨得过去,
      #   Windows 这端跨不过去(⚠ 别把 Linux 那格的形当成「两端都成立」——
      #   同 438 那条「照抄仓里已有的形之前,先核对那个形的前提在我这条路上成立吗」)。
      #
      # ⛔ **别把「三个地址各问一遍」那段诊断当多余留着** —— 它值钱的地方正是**证伪了我的猜法**;
      #    留在这里,下次任一端再红时它仍然一眼分档:全 ✗ = 进程不在了,只有 localhost ✗ = 地址对不上。
      # ⚠ 这一端**不套 xvfb、不设 `GTK_IM_MODULE`**:WebView2 两样都不读(450 那条 XIM 的课只落在
      #    GTK 那一端)⇒ 那条 `npx wdio` 与 CLAUDE.md 写给人的那条逐字相同。
      # ⚠ 判红走 440 那把三态尺(`scripts/e2e-verdict.mjs`):**绿必须有正面字据**,读不出是
      #    `unknown` 而不是「那就算它绿吧」;`--specFileRetries=0` 与「日志里有没有重试痕迹」互为背书。
      - name: vite + e2e(39 spec,零重试;⛔ 同一步,理由见上)
        shell: bash
        env:
          YS_E2E_FAST: "1"
        run: |
          set -o pipefail
          # 后台起 vite,并把它的 pid 记下来 —— 同一步内它是本 shell 的子进程,活得到 wdio 跑完。
          npm run dev > "$RUNNER_TEMP/vite.log" 2>&1 &
          vite_pid=$!
          echo "vite pid=$vite_pid"

          node -e '
            const net = require("node:net");
            const hosts = ["localhost", "127.0.0.1", "::1"];
            const deadline = Date.now() + 60000;
            const open = (host) => new Promise((res) => {
              const s = net.connect({ host, port: 1420 });
              s.on("connect", () => { s.destroy(); res(true); });
              s.on("error", () => res(false));
            });
            (async function probe() {
              for (;;) {
                const got = {};
                for (const h of hosts) got[h] = await open(h);
                const reach = hosts.map((h) => `${h}=${got[h] ? "✓" : "✗"}`).join(" ");
                if (got.localhost) { console.log("vite 起来了 —— 1420 可达性:" + reach); process.exit(0); }
                if (Date.now() > deadline) {
                  console.error("::error::60 秒内 localhost:1420 连不上 —— 可达性:" + reach);
                  console.error(got["127.0.0.1"] || got["::1"]
                    ? "⇒ vite 在跑,但它绑的地址与 localhost 解析到的不是同一个(⛔ 不是启动慢)"
                    : "⇒ 三个地址全不通 ⇒ 那个进程不在了(或从没绑上)—— 看下面它自己的日志");
                  process.exit(1);
                }
                await new Promise((r) => setTimeout(r, 500));
              }
            })();
          ' || { cat "$RUNNER_TEMP/vite.log" 2>/dev/null; kill "$vite_pid" 2>/dev/null; exit 1; }

          # ⭐⭐ **冒烟闸:先只跑一支,起得来会话再跑另外 38 支。**
          # 452 第三趟的读数就是这道闸存在的理由:会话起不来时,**每一支要 4 分钟才放弃**
          # (02:02:06 开跑 → 02:06:13 第一支报错),39 支 × 4 分 = 156 分 ⇒ 整个 job 撞上
          # 90 分钟上限被砍,而它要说的其实只有一句话「WebView2 起不来」。
          # ⇒ 同 450 那道 locale 闸的判据:**答不上来就当场停,别拿三十来支看着像真缺陷的红
          #   去浪费下一个人半小时**。⚠ 这一支跑完库会被下面那趟的 `onPrepare` 清掉,不留残留。
          set +e
          npx wdio run e2e/wdio.conf.js --spec e2e/specs/capture.e2e.js --specFileRetries=0 2>&1 \
            | tee "$RUNNER_TEMP/e2e-smoke.log"
          smoke=${PIPESTATUS[0]}
          set -e
          if grep -q "session not created" "$RUNNER_TEMP/e2e-smoke.log"; then
            kill "$vite_pid" 2>/dev/null || true
            echo "::error::WebView2 会话起不来(session not created)—— ⛔ 不再跑另外 38 支,那只会把同一句话重复 39 遍并撞上 job 超时"
            grep -m3 "session not created" "$RUNNER_TEMP/e2e-smoke.log"
            exit 1
          fi
          echo "冒烟过了(退出码 $smoke)—— 会话起得来,往下跑全量"

          set +e
          npx wdio run e2e/wdio.conf.js --specFileRetries=0 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          status=${PIPESTATUS[0]}
          set -e
          kill "$vite_pid" 2>/dev/null || true
          node scripts/e2e-verdict.mjs "$RUNNER_TEMP/e2e.log" --status="$status" --label="Windows / WebView2"

      # 红的时候要能拿到整份日志。⚠ `if: always()` —— 绿的那趟也留,它是「与人跑的读数
      # 对不对得上」的底稿(规矩 4:数字打架取实跑)。
      - name: 日志存档
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-windows-log
          path: |
            ${{ runner.temp }}/e2e.log
            ${{ runner.temp }}/e2e-smoke.log
            ${{ runner.temp }}/vite.log
            ${{ runner.temp }}/msedgedriver-verbose.log
          if-no-files-found: warn
          retention-days: 14
