name: release

# 打 tag(vX.Y.Z)触发:三平台构建签名 → 合并一份三平台 latest.json → scp 到 VPS
# (zjci 受限用户,只能写 /var/www/zhujian-app/updates/)→ 核验。分发落点=zhujian.app,
# updater endpoint 不变、老用户无感。安卓走 android.json 另发(build-android.mjs)。
# 首发前必读 docs/deploy.md §7。

# 公开仓最小权限:自动 GITHUB_TOKEN 只读(本仓不建 Release、只 scp 到 VPS)
permissions:
  contents: read

on:
  push:
    tags: ["v*"]

# 发版中途绝不取消
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ⭐ 385 立的发版闸:tag 是自动发给真实用户的边界,此前它前面没有任何机器门槛。
  # 本体在 preflight.yml(reusable,安卓那条 tag 线共用同一份,两处零抄写);
  # 它跑什么、刻意不跑什么,判据都写在那个文件的头注里。
  preflight:
    uses: ./.github/workflows/preflight.yml

  build:
    needs: preflight
    name: build ${{ matrix.label }}
    strategy:
      fail-fast: true # 有一个平台没打出来就别发半套
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
          - os: macos-latest
            label: darwin-aarch64
          - os: ubuntu-22.04
            label: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: 校验 tag 与 package.json 版本一致
        shell: bash
        run: |
          ver=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $ver 不一致——三处版本先同步 bump"
            exit 1
          fi

      - name: Linux 系统依赖(Tauri v2)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - run: npm ci

      # bash 统一三平台;tr 去掉粘贴 secret 时可能带入的尾换行(base64 单行钥无内部换行,删 CR/LF 安全)
      # 重试 3 次:Linux AppImage 打包现从 GitHub 拉 linuxdeploy/AppRun,偶发 Connection reset(os error 104);
      # 工具首次下载后进 target 缓存,重试跳过重编译成本低;Win/mac 一般一次过,重试对其是无害空转。
      - name: tauri build(签名更新产物)
        shell: bash
        env:
          RAW_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="$(printf '%s' "$RAW_SIGNING_KEY" | tr -d '\r\n')"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          n=0
          until npm run tauri build; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "::error::tauri build 连续 3 次失败"; exit 1; fi
            echo "::warning::tauri build 第 $n 次失败,10s 后重试(多为 AppImage 工具下载瞬时 reset)"
            sleep 10
          done

      - name: 收集产物(updater 产物 + .sig + 首装包)
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.label }}
          path: |
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/release/bundle/**/*-setup.exe.sig
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.app.tar.gz.sig
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.AppImage.sig
            src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: error

  publish:
    name: 合并清单并发到 VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 取 tag 对象本身(注解 tag 的 message 要当更新说明)

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # notes 取注解 tag 的 subject(第一行),空则回落「朱简 vX.Y.Z」。296 起
      # 提示条会把它显给用户,故这里不再恒定写死版本串——那样显出来只是重复。
      - name: 生成三平台 latest.json + 收集 upload/
        run: |
          notes=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          [ -z "$notes" ] && notes="朱简 ${GITHUB_REF_NAME}"
          echo "更新说明:$notes"
          node scripts/gen-update-manifest-ci.mjs artifacts upload "$notes"

      # ⚠ 385:这一步**必须在上传之前**。签名是存量用户唯一的接受判据——签错了产物照样
      # 200、清单照样好看,而每个老用户被 updater 静默拒绝、卡在旧版且毫无提示。
      # 更要命的是下一步的上传会**先 rm 掉旧包和 latest.json**:签名坏时若已经传上去,
      # 用户既装不上新版、也没有旧版可回退。故判据前移到「还没碰线上任何东西」这一刻。
      - name: 验签(上传前,只认本地产物)
        run: node scripts/verify-update-signature.mjs --manifest upload/latest.json --artifacts upload

      - name: 配置 SSH(受限 deploy key)
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # ⚠ 583 换掉了这一步的形,别改回去。此前是「`ssh rm -f 旧包+latest.json` 然后 `scp upload/*`」
      # —— 582 实测:磁盘满时那个 `rm` **照样成功**,`scp` 每个文件只写进 261,120 字节就断
      # ⇒ 线上进入「旧包已删 / 新包是残骸 / latest.json 完整且指着这些坏包」态。存量用户看到
      # 有新版 → 下载 → **验签必失败装不上**,而官网下载卡指着的旧包也没了 ⇒ 新装机同样 404。
      # 现在走共用的 `scripts/release-upload.sh`:先问空间(不够就在**碰线上任何东西之前**红)
      # → 传 `.uploading` 临时名 → 逐个核字节数 → 换名(**清单最后**)→ 才清旧包。
      # ⛔ 清单最后换是承重的一格:先换清单 = 指着还没就位的包。阴性对照(含反向刀)=
      #    `node scripts/gate-sandbox-release-upload.mjs`。
      - name: 上传到 VPS updates/(空间闸前置 + 临时名换名,不碰 apk/android.json)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          export ZJ_SSH_KEY="$HOME/.ssh/id_ed25519"
          export ZJ_UPLOAD_HOST="zjci@$(printf '%s' "$VPS_HOST" | tr -d '\r\n')"
          export ZJ_UPLOAD_DIR=/var/www/zhujian-app/updates
          bash scripts/release-upload.sh upload latest.json \
            '*-setup.exe' '*.app.tar.gz' '*.AppImage' '*.dmg' '*.deb'

      - name: 核验线上清单
        run: |
          curl -s --fail "https://zhujian.app/updates/latest.json" > got.json
          node -e "const j=require('./got.json');console.log('线上 latest.json 版本',j.version,'| 平台',Object.keys(j.platforms).join(', '))"
          test "$(node -p "require('./got.json').version")" = "$(node -p "require('./package.json').version")"
