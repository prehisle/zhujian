name: android-nightly

# 每日夜间构建安卓「签名发版 APK」存档(不发版给用户)。走统一入口 scripts/build-android.mjs
# (三处版本一致校验 + tauri android build + aapt 验 versionCode + build-profile.json 护栏)。
# 安卓发版给用户走 android-release.yml(211 起:打 android-v* tag 触发,deploy.md §7.4a);
# §7.4 单机手动保留为 fallback。安卓版本与桌面 v* 刻意不同步(0.3.x vs 0.2.x)、发版节奏不绑,
# 故两条 tag 线各走各的。

# 公开仓最小权限:自动 GITHUB_TOKEN 只读(本 job 只存 artifact、不建 Release、不碰 VPS)
permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *" # 每日 UTC 18:30(错开桌面 nightly 的 18:00)

concurrency:
  group: android-nightly
  cancel-in-progress: true

jobs:
  build:
    name: build android aarch64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: 装 JDK 17(AGP 8.x / gradle 8.14.3 需 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "android/src-tauri"

      - name: 装 android 子工程 npm 依赖
        run: cd android && npm ci

      # runner 未必预装 compileSdk 36 / 带 aapt 的 build-tools;显式补(已装则秒过)
      - name: 确保 SDK 组件(platform 36 + build-tools 36)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null

      # gen/android 的 gradle wrapper distributionUrl 指向本地翻墙 zip(见 dev-and-testing §安卓);
      # CI 在墙外,改回官方直连 URL。仅改 CI 工作副本、不回写仓库。
      - name: 修正 gradle wrapper 分发 URL(本地 file:// → 官方)
        run: |
          f=android/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          sed -i "s#^distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-8.14.3-bin.zip#" "$f"
          grep distributionUrl "$f"

      # 签名钥从 secret 复现:base64 的 jks 解码落盘 + 写 keystore.properties(gitignore、绝不进仓)。
      # storeFile 用正斜杠绝对路径(反斜杠会被 Java Properties 当转义吃掉,dev-and-testing 有记)。
      - name: 复现 release 签名配置
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          jks="$RUNNER_TEMP/zhujian-android.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$jks"
          props=android/src-tauri/gen/android/keystore.properties
          {
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'storeFile=%s\n' "$jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
          } > "$props"

      - name: 构建签名发版 APK(统一入口,含 aapt 验 + 护栏)
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK_HOME=$NDK_HOME"
          node scripts/build-android.mjs

      - name: 收集签名 APK
        uses: actions/upload-artifact@v7
        with:
          name: android-nightly-aarch64
          path: |
            android/apk-out/*.apk
            android/apk-out/build-profile.json
          retention-days: 14
          if-no-files-found: error

      # ⭐ 518 接上(backlog 测试与工装 40):那套 Kotlin JVM 单测此前**没有任何自动边界会去
      # 跑它** —— `.github/workflows/` 里 `gradlew` 零出现,`preflight` 的 `shells` 那格跑的是
      # 壳的 cargo、不含它 ⇒ 红着和绿着对外一模一样(同 512 那条:`check-i18n-plural-render`
      # 在干净树上红了十一天没人知道)。它守的是 SAF 桥那几道**安全闸**的纯逻辑
      # (H-1 的四条校验 / 尺 4 / single-flight / 收尸分支),坏了是「私有区文件被搬进用户目录」
      # 那一档,不是「圆角差 2px」。
      # ⚠ **这一格是警报**(每晚一趟,早知道);**发版闸那半在 `android-release.yml`**,同一步、
      #    排在 scp 之前 —— 只有闸没有警报,就成了「平时不跑、红的时候你正在发版」。
      #
      # ⛔ **为什么排在构建之后**(不是「想晚点跑」,是排不到前面去):`gen/android` 在干净检出里
      # **根本编不了** —— `tauri.settings.gradle`、`app/tauri.build.gradle.kts`、整个
      # `app/src/main/**/generated/` 都是 gitignore 的 tauri CLI 生成物,而 `tauri.settings.gradle`
      # 里写的还是**作者机器**的绝对路径(指向本机 cargo registry 里 tauri / barcode-scanner /
      # opener 三个安卓子工程)。上面那步 `tauri android build` 会按**本 runner** 的路径把这几样
      # 重新生成,之后 gradle 才配置得起来 ⇒ **顺车跑最省**;单独立一格要么重跑一整趟安卓构建,
      # 要么把 CLI 模板搬进仓里。⚠ `keystore.properties` 同理 —— 缺它 gradle 在配置期就死在
      # `app/build.gradle.kts` 的 `keyAlias ... as String`(实测:`null cannot be cast to
      # non-null type kotlin.String`),而上面「复现 release 签名配置」那步已经写好了。
      #
      # ⚠ **不需要 NDK、也不会顺带去构 `.so`** —— 实测不是推断:
      #    `:app:testUniversalDebugUnitTest --dry-run` 的任务图里 `rust`/`jni`/`ndk`/`cargo`
      #    **零出现**(`buildSrc` 的 `RustPlugin.kt` 把 `rustBuild*` 挂在 `merge*JniLibFolders` 上,
      #    那是打包 APK 那条链,单测这条不经过)。也**不重开 daemon**:复用上一步那只热的。
      #
      # ⚠ **判绿不看 gradle 的退出码** —— test 任务在一支都没跑时照样 `BUILD SUCCESSFUL`
      #    (源文件被挪走 / 任务名改了 / 变体改了名,三种形都安静地绿)⇒ 走
      #    `kotlin-test-verdict.mjs`(0 绿 / 1 红 / 2 判不出,同 `e2e-verdict.mjs` 口径)。
      #    那把尺自己的十刀阴性对照:`node scripts/check-kotlin-test-verdict.mjs`。
      # ⚠ `if: always()` —— 上面收产物那步失败也照跑:这一格问的是「树对不对」,与「产物收没收上」无关。
      - name: Kotlin JVM 单测(SAF 桥那几道闸的纯逻辑)
        if: always()
        run: |
          set +e
          (cd android/src-tauri/gen/android && ./gradlew :app:testUniversalDebugUnitTest)
          status=$?
          set -e
          node scripts/kotlin-test-verdict.mjs \
            android/src-tauri/gen/android/app/build/test-results/testUniversalDebugUnitTest \
            --status="$status" --label="android-nightly(警报)"
