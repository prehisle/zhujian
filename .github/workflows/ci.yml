name: ci

# ⭐ 448 立(ci-plan 阶段 2):公开仓上的 CI 警报 —— 两平台五套 cargo + 十道门禁(`gates` → preflight.yml)、
#   450 加 Linux 真 GUI e2e(`linux-e2e`)、674 加安卓前端 vite build、542 加全绿后三平台构建。立项理由(此前 CI 一次 push 都不跑、
#   规矩 5 那笔复跑债 ≈ 1/10 的轮次)与逐阶段读数在 ci-plan §4 / §9。
# ⛔ 它不是合并闸,是警报:直推 master、没有 PR 流程 ⇒ CI 红 = master 红。真正 fail-closed 的那道是 `preflight` 被两条 release tag 线
#    用 `needs` 挂着的那次调用,本文件一个字都不改它。
# ⛔ Windows/WebView2 那趟 e2e 不在这里 —— 它才是判发版的那趟(396 起口径没变),归 ci-plan 阶段 4;别在这里顺手加,
#    那会把「快速警报」变成慢闸。

permissions:
  contents: read

on:
  push:
    # ⛔ 写 `branches:`,别写 `tags-ignore`(448 第一版栽过):GitHub 的规则是「只定义了 tags/tags-ignore(或只定义 branches/branches-ignore),
    #   工作流就不会为那个没被定义到的 ref 类型跑」—— 那一版对分支推送根本不触发,`ci` 已登记 active、main 的头也换了,而 run 一趟都没建。
    #   tag 是「没被定义到的 ref 类型」⇒ 日常推快照绝不会顺手启动 tag 触发的发版线(`release.yml` = `v*`,`android-release.yml` = `android-v*`)。
    # ⭐⭐ 535 起从 `["**"]` 收窄成 `["gate/**"]`,per-push 那一层关掉了(用户 2026-08-29 点名 CI 太影响效率;量出来的判据、诚实边界、
    #   翻案门全在 ci-plan §9 顶那段与 progress-log 535,⛔ 别凭印象改回去)。⚠ 不是「CI 变少了」,是换了触发时机:闸分支照旧每推必跑
    #   (`branch-gate.mjs` 的 `gatedDelta()` 决定哪些改动产生闸分支)+ `schedule` 每天一趟全矩阵 + `workflow_dispatch` 手动。
    # ⛔ 探针分支(`ci-probe-*`)从此不自动跑了:阴性对照改用 `gh workflow run ci.yml --ref <分支>`(或命名成 `gate/<环境名>/<记号>`),
    #   别为它把 `**` 加回来(收纳格 51(b))。
    branches: ["gate/**"]

  # ⭐ 夜跑那一半(535):每天一趟全矩阵,验的是那一刻 `main` 的头 —— 一天里推了五次只有最后那棵树被验过;要立刻要一趟就手动 dispatch。
  # ⚠ 19:30Z 是为了错开 `android-nightly` 18:30Z / `nightly-e2e` 那条注释着的 19:00Z;542 之前的 `nightly` 18:00Z 已退役(构建挪到下面 `nightly-build`)。
  # ⭐ 红了怎么知道:GitHub 的失败邮件(用户 2026-08-29 确认收得到;535 补回查 `schedule` 那条路也真跑红过,ci-plan §9 顶那段)。
  schedule:
    - cron: "30 19 * * *"

  # 手动:探针分支的阴性对照、想立刻要一趟裁决、或夜跑红了要复跑。542:`build_artifacts` 开着才顺带出三平台产物(schedule 恒出)。
  workflow_dispatch:
    inputs:
      build_artifacts:
        description: "全绿后构建三平台桌面产物并存档(schedule 恒开,这里只管手动那趟)"
        type: boolean
        default: false

# ⛔ 刻意没有 `concurrency`(517 补立账、518 拿掉;测试与工装 41;全文在 ci-plan §8 第 11 条)。
#   `cancel-in-progress: true` 掐掉的不是「重复的跑」,是上一轮的裁决(517 收口那趟把 516 跑到 25m50s 的那趟掐成 cancelled,近 14 趟里 cancelled 占 4)。
#   丢的是墙钟(连着推永远拿不到裁决)与观测机会(等的就是「下一次红那句话」),覆盖面倒是一点没丢(被掐那趟是新趟的子集)。
# ⛔ 另外两条路都查过了,别再挑回来:「靠人推之前先 `gh run list` 一眼」是要人补偿一台正在毁证据的机器(memory `guards-must-bind-to-the-automatic-edge`);
#   「只给 `linux-e2e` 开豁免」救不了 —— `gates` 是 `uses:` 调 preflight,job 级 concurrency 一挂就把里头全掐;
#   「留 group、`cancel-in-progress: false`」更糟,新趟变排队且 GitHub 只保留最新那个 pending。
# ⚠ 代价是真的:连推 N 次就有 N 趟并行,超出并发上限的排队(仍会跑完、仍给裁决)。其余四条 workflow 的 `concurrency` 一个字没动。

jobs:
  # ⭐ 这道 `if` 守的是钱:同一份文件既在私有工作仓、也在公开仓(导出快照);ci-plan §6 拍板 A = CI 跑在公开仓(免费无限),
  #    私有仓的 Windows runner 是 10 倍计费,不守这一句每推一次就在私有仓白烧一趟。
  # ⛔ 这道 `if` 不许挪进 `preflight.yml`:那个文件是发版闸,把「在哪个仓」写成它的条件 = 给它开一条「条件不成立时安静地跳过」的路,
  #    而门禁失灵的方式正是安静的绿。这里安全,是因为本文件只负责警报,跳过 = 没有警报,不冒充「已经验过了」。
  gates:
    if: github.repository == 'prehisle/zhujian'
    uses: ./.github/workflows/preflight.yml

  # ⭐ 450(ci-plan 阶段 3):Linux 真 GUI e2e 跑在托管 runner 上 —— 共用面改动的主要验收面就是它,规矩 5 那笔债的 Linux 半从此由 CI 还。
  # ⛔ 它判不了发版:WebKitGTK 不是生产渲染引擎(396 起口径没变)⇒ 落在本文件(警报)而不是 `preflight.yml`(发版闸),
  #    往 fail-closed 的发版闸里塞一个判不了发版、还带抖动的套件,换来的只有「抖动挡住发版」。
  # ⚠ 与 `gates` 互不依赖,同时开跑;`gates` 两三分钟就完,这一格是几十分钟那一档。
  linux-e2e:
    if: github.repository == 'prehisle/zhujian'
    # ⛔ 名字里刻意不写 spec 数(518,测试与工装 31):job 名在 job 起来之前就要定,拿不到运行期读数,写进去只会腐烂;
    #    真数在 `e2e-verdict.mjs` 印的读数行与 job summary 里(memory `stale-number-in-docs-and-fixtures`)。
    name: e2e(Linux / WebKitGTK)
    runs-on: ubuntu-22.04
    # 兜住「挂死」那一形:本机全量 10 分钟,托管 runner 慢几倍(448 实测 core 慢 ≈6.5 倍)。
    # ⚠ 超时 = 红,而且是判不出那一档的红(日志里不会有汇总行)—— 440 那把尺的三态。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # 与 preflight 的 `shells` 那格逐字同一串(Tauri v2 在 Linux 上编壳要的那套),另加两样只有 e2e 要的:
      #   `webkit2gtk-driver` = `/usr/bin/WebKitWebDriver`(wdio.conf.js 写死的那条路径,jammy universe 里与 libwebkit2gtk-4.1 同源同版)、`xvfb`。
      # ⚠ 步级超时是 450 当天用上的:落地那趟这一步与 preflight 的 `shells` 一起卡在 `apt-get` 上 52 分钟(runner 的 apt 镜像挂住,
      #    不是我们的树);不设步级上限它会吃掉整个 job 的 90 分钟、报成一次说不清的红。15 分钟对正常 apt(~60 秒)绰绰有余;
      #    preflight 的 `shells` 那格 518 同样补了(那格是发版闸,默认 360 分钟)。
      - name: 系统依赖(Tauri v2 + WebKitWebDriver + Xvfb)
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config \
            webkit2gtk-driver xvfb

      # ⭐ 394 那一课,这里是它唯一的落点:整套断言是中文串,语言「自动」档在 Linux 跟的是进程 locale;`wdio.conf.js` 钉死了
      #    `LANG=LC_ALL=zh_CN.UTF-8`,但钉死的是变量不是 locale 本身 —— 机器上没生成 zh_CN.utf8 时 glibc 静静退回 C,
      #    现象与「没钉」一模一样(en_US 容器里实测 32/36 假红)。⇒ 这里生成它并当场核一句,核不到就停。
      - name: 中文 locale(394:英文 locale 下 32/36 假红)
        run: |
          sudo locale-gen zh_CN.UTF-8
          if ! locale -a | grep -qix 'zh_CN.utf8'; then
            echo "::error::zh_CN.UTF-8 没生成 —— 硬跑下去是三十来支假红,而它们看着像真缺陷(394 判例)"
            locale -a | head -20
            exit 1
          fi
          echo "locale OK:$(locale -a | grep -ix 'zh_CN.utf8')"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ⚠ 钉版本:`tauri-driver` 是我们自己的台架件,钉住它 = CI 与开发机跑的是同一个东西(2.0.6 = Linux 那台开发机实测在用的版本,
      #    开发机升了这里跟着改)。⛔ 别跟 ci-plan §8-2 那条(msedgedriver 必须跟着 runner 的 WebView2 漂)混起来,方向相反。
      # ⚠ 每趟从源码编 1-2 分钟,没单独加缓存:这一格总长几十分钟,为它加一层缓存键不划算。
      - name: tauri-driver(wdio.conf.js 认 ~/.cargo/bin/tauri-driver)
        run: cargo install tauri-driver --locked --version 2.0.6

      # ⭐ `wdio.conf.js` 写死了三条绝对路径,在开发机上天然成立、在 runner 上是假设(`~/.cargo/bin` 认的是 `homedir()` 不是 `CARGO_HOME`);
      #    缺了任一条,现象是会话起不来那种看不懂的红 ⇒ 当场问一句,答不上来就停。
      - name: 前置检查(wdio.conf.js 写死的三条路径)
        run: |
          fail=0
          for f in "$HOME/.cargo/bin/cargo" "$HOME/.cargo/bin/tauri-driver" /usr/bin/WebKitWebDriver; do
            if [ -x "$f" ]; then echo "✓ $f"; else echo "::error::缺 $f(wdio.conf.js 写死认这条路径)"; fail=1; fi
          done
          exit $fail

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # ⚠ fast 形是 Linux 上唯一跑得了的形(release 的资产源在 Linux/WebKitGTK 是 `tauri://localhost`,配置里写的是 wry 在
      #    Windows/Android 的 workaround URL,硬跑全红在 goShow;wdio.conf.js 有响亮拒)。fast 形要两样:debug 二进制 + vite。
      # ⚠ 这一步 `wdio.conf.js` 的 `onPrepare` 也会做一遍(增量,秒级)—— 故意重复:编译失败要红在这一步、看得见 rustc 原话,
      #    埋在 e2e 里只会表现为「日志里没有汇总行」⇒ 判不出。⛔ 别为「省一步」删掉。
      # ⚠ 刻意不跑 `npm run build`:`cargo build` 不开 `custom-protocol` ⇒ 走 devUrl,`dist/` 缺席照样编得过(与 preflight 两格同口径)。
      - name: 编 debug 壳(fast 形要它)
        run: cd src-tauri && cargo build

      - name: vite dev server(fast 形的资产源)
        run: |
          nohup npm run dev > "$RUNNER_TEMP/vite.log" 2>&1 &
          # 等端口。⚠ 探针用 `localhost` 而不是 127.0.0.1 —— 与 wdio.conf.js 的 portOpen 同口径
          # (vite 绑 IPv4 还是 IPv6 由环境定,那里为此专门写过一句注释)。
          node -e '
            const net = require("node:net");
            const deadline = Date.now() + 60000;
            (function probe() {
              const s = net.connect({ host: "localhost", port: 1420 });
              s.on("connect", () => { s.destroy(); console.log("vite 起来了"); process.exit(0); });
              s.on("error", () => {
                if (Date.now() > deadline) { console.error("::error::vite 60 秒没起来"); process.exit(1); }
                setTimeout(probe, 500);
              });
            })();
          ' || { cat "$RUNNER_TEMP/vite.log"; exit 1; }

      # ⭐ 判红不看退出码,走 440 那把三态尺(`scripts/lib/test-verdict.mjs`;壳是 `scripts/e2e-verdict.mjs`):绿必须有正面字据,
      #    读不出是 `unknown`,⛔ 不许退回「那就算它绿吧」。
      # ⚠ `--specFileRetries=0`:配置常态开着 `specFileRetries:1` 吸收冷启假红,CI 上要的是未经吸收的原始读数;开关与「日志里有没有
      #    重试痕迹」两半互为背书(见那个壳的头注)。
      # ⚠ `xvfb-run -a`:WebKitWebDriver 在 DISPLAY 缺席时会自己起一个 `:100`(450 实测),不套也跑得起来;仍显式套,
      #    让「CI 跑的那条命令」与 dev-and-testing 里写给人的那条逐字相同。
      - name: e2e(零重试)
        env:
          YS_E2E_FAST: "1"
        run: |
          set +e
          xvfb-run -a npx wdio run e2e/wdio.conf.js --specFileRetries=0 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          status=${PIPESTATUS[0]}
          set -e
          node scripts/e2e-verdict.mjs "$RUNNER_TEMP/e2e.log" --status="$status" --label="Linux / WebKitGTK"

      # 红的时候要能拿到整份日志(spec reporter 只在结尾汇总,而 GitHub 的日志页对几万行
      # 不好翻)。⚠ `if: always()` —— 绿的那趟也留,它是「与人跑的读数对不对得上」的底稿。
      - name: 日志存档
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-linux-log
          path: |
            ${{ runner.temp }}/e2e.log
            ${{ runner.temp }}/vite.log
          if-no-files-found: warn
          retention-days: 14

  # ⭐ 674(测试与工装 99 ②):安卓前端在公开树上 `vite build` 一遍(约一分钟,只用 node)。670 发版红在「公开树缺安卓包烤进去的
  #    协议页」,而闸分支对安卓壳只 `cargo test`(不开 custom-protocol,`dist/` 缺席照样编得过)从不碰安卓前端 ⇒ 四轮全绿、夜跑早红了没人看。
  # ⇒ `npm run build` 与 `tauri android build` 的 beforeBuildCommand 是同一条命令,前端这一层看到的是同一棵树。
  # ⛔ 刻意不在闸分支构建整只 APK(9 分钟,那是夜跑的活)。⚠ 它判不了「安卓包能装能跑」,只判「公开树上前端资源齐不齐、编不编得过」
  #    (缺文件 / import 指到导出白名单之外 / TS 编不过,三种都在这儿红)。与 `gates` / `linux-e2e` 互不依赖,分钟级。
  android-frontend:
    if: github.repository == 'prehisle/zhujian'
    name: 安卓前端 vite build(公开树)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: android/package-lock.json
      - run: cd android && npm ci
      # ⚠ 用 `npm run build` 不用裸 `npx vite build`:前者才是 tauri.conf.json 里 beforeBuildCommand
      #    那一条,改了那句这里自动跟着。
      - run: cd android && npm run build

  # ⭐ 542(用户点名「每日构建测试、保存通过后的版本」):全矩阵绿了才构建存档 —— 同一趟、同一个 sha(此前 `nightly.yml` 的
  #    build 与 test 并列、红树的包照样存档,542 起它退役,构建挪到这里挂在三根裁决后面)。
  # ⛔ `needs` 三格都要列:`gates` 是 reusable preflight(内部 540 那格 `all-green` 逐格汇总),`linux-e2e` / `android-frontend`
  #    是本文件的独立 job,只挂 `gates` 就把它们的红放过去了(674 加第三格)。needs 默认语义 = 上游任一 failure / cancelled / skipped
  #    ⇒ 本 job skip ⇒ 没有产物,而「没有产物」正是要的答案,⛔ 别给它加 always() 之类的豁免。
  # ⚠ 产物名带 sha(隔几天也认得出构建自哪棵树);只在 schedule(恒)与手动带 `build_artifacts=true` 时构建,闸分支的 push 要的是裁决不是包。
  nightly-build:
    needs: [gates, linux-e2e, android-frontend]
    if: >-
      github.repository == 'prehisle/zhujian' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.build_artifacts))
    name: 全绿后构建 ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
          - os: macos-latest # Apple Silicon(arm64)
            label: darwin-aarch64
          - os: ubuntu-22.04
            label: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux 系统依赖(Tauri v2)
        if: matrix.os == 'ubuntu-22.04'
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - run: npm ci

      # createUpdaterArtifacts:true 要求签名;mac 未配 Apple 证书 → app 为 adhoc(公证留 release 时补)
      # bash 统一三平台;tr 去掉粘贴 secret 时可能带入的尾换行(base64 单行钥无内部换行,删 CR/LF 安全)
      # 重试 3 次:Linux AppImage 打包从 GitHub 拉 linuxdeploy/AppRun,偶发 Connection reset(os error 104)
      - name: tauri build(签名更新产物)
        shell: bash
        env:
          RAW_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          export TAURI_SIGNING_PRIVATE_KEY="$(printf '%s' "$RAW_SIGNING_KEY" | tr -d '\r\n')"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          n=0
          until npm run tauri build; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "::error::tauri build 连续 3 次失败"; exit 1; fi
            echo "::warning::tauri build 第 $n 次失败,10s 后重试(多为 AppImage 工具下载瞬时 reset)"
            sleep 10
          done

      - name: 收集产物(名带 sha —— 它构建自哪棵树要认得出)
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.label }}-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/**/*-setup.exe
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/**/*.tar.gz
          retention-days: 14
          if-no-files-found: error
