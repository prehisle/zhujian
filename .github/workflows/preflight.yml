name: preflight

# ⭐ 385 立:发版闸。tag(桌面 `v*` / 安卓 `android-v*`)是自动发给真实用户的边界,自动发布边界不可以没有刹车;
#   由两条 release workflow 用 `uses:` 调用(reusable,两处零抄写),也可 `workflow_dispatch` 手动探一趟 ——
#   ⛔ 改了门禁或本文件之后照旧先探一趟,别拿发版当首测。立项与逐格读数:progress-log 385(十道门禁)/ 386(`shells`)/
#   448(Windows 那格,ci-plan 阶段 2)/ 540(拆片 + `all-green`)。
# ⛔ 518 起:job 名与注释里一律不写「跑出来多少支」那种数(测试与工装 31)—— job 名在 job 起来之前就要定,写死的数只会腐烂
#   (memory `stale-number-in-docs-and-fixtures`);「三套」「十道」这类结构数照留,它们数的是紧接着的几行 `run:`。
# ⛔ 刻意不放进来的两样(判据在 progress-log 385/386):e2e(要 Windows + 真 WebView2 + 先停掉占全局热键的生产实例,塞进来产的是
#   环境噪声不是发布判据)、check-deployed-drift(问的是线上,要网络 + ssh,发版前问没有意义)。

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  preflight:
    name: cargo test 三套 + 十道门禁
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            server
            sync-proto
      # core / server / sync-proto 三套(两壳那两套 + 共享手机层在下面的 `shells` 格,386 起)。
      - run: cd core && cargo test --quiet
      - run: cd server && cargo test --quiet
      - run: cd sync-proto && cargo test --quiet

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      # 只有 check-filter-parity 要 esbuild;其余九道只用 node 内置 + scripts/lib。
      - run: npm ci

      - name: 十道发版门禁(清单以 CLAUDE.md「怎么跑」为准)
        run: |
          set -euo pipefail
          for g in lock-drift theme-drift contrast hardcoded-colors timing-drift \
                   radius-drift fs-drift filter-parity hit-zone i18n-drift; do
            echo "── check-$g"
            node "scripts/check-$g.mjs"
          done

  # 386:两壳的 cargo test。与上面那格**互不依赖**,同时开跑。
  shells:
    name: cargo test 三格(桌面壳 / 安卓壳 / 共享手机层)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # 两壳都是 tauri crate,Linux 上编它要 webkit2gtk 一套(与 release.yml 的 Linux 那格逐字同一串)。
      # ⚠ 安卓壳这里编的是 host target(x86_64-linux),跑纯 Rust 单测与集成测,不需要 NDK。
      # ⭐ 518 补步级上限(ci-plan §8-9):450 那天这一步与 `ci.yml` 的 `linux-e2e` 一起卡在 runner 的 `apt-get` 上 52 分钟,不设上限它会
      #    吃掉 job 默认的 360 分钟、把一次基础设施事件呈现成一次发版被卡;15 分钟对正常 apt(~60 秒)绰绰有余。
      - name: Linux 系统依赖(Tauri v2)
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            android/src-tauri
            mobile

      # ⚠ 刻意不跑 `npm run build`:`generate_context!` 只有开了 `custom-protocol` 才嵌 `frontendDist`,cargo test 不开它 ⇒ 走 devUrl,
      #    `dist/` 缺席照样编得过。别顺手补一步前端构建。
      - run: cd src-tauri && cargo test --quiet
      - run: cd android/src-tauri && cargo test --quiet
      # OH-d/D1:两只手机壳共用的那一层(coord + 命令面 + 启动装配)。⚠ 它含起真同步服务的「加入空间」端到端集成测,别与重负载并行。
      - run: cd mobile && cargo test --quiet

  # 448(ci-plan 阶段 2):全套在 Windows 上再跑一遍 —— 此前 CI 里从没有一条 Rust 测试在 Windows 上跑过,而 Windows 是唯一的生产桌面端,
  #   425 那支缺陷(`FlushFileBuffers` 对只读句柄 `ERROR_ACCESS_DENIED`,恢复在生产端落不了位)正长在这个洞里,设计审与实现审都读不出平台 API 语义差。
  # ⛔ 不在这几格跑那十道门禁:它们是平台无关的 node 脚本,在第二个操作系统上跑一遍不产生新判据。这几格要的是平台 API 语义。
  # ⚠ 安卓壳这里编的是 host target(x86_64-windows),跑纯 Rust 单测,不需要 NDK。两端 core 的测试条数本来就不同(backup 有 `#[cfg(unix)]` 测试),
  #    这里只判过不过,⛔ 别去对数、别写下当时的读数。
  # ⭐⭐ 540 翻案:原来写着「不拆成两格」,现在拆成 `windows-core`(三片并行)+ `windows-rest`。判据不是「拆不拆更干净」,是「最长那根杆有多长」:
  #    多付的一次检出 + rust-cache 还原 = 45~65 秒,而 `cd core && cargo test` 一步 = 19~38 分钟(全在跑测、不是编译也不是 CPU 并行度;
  #    像是磁盘 I/O 但那是推断)—— 读数与三条查实在 progress-log 540。
  # ⚠ 「core 含起真同步服务器的集成测,刻意串行」依然成立,分片没有违反它:分的是 job(各自独立的 VM),⛔ 别据此把同一格里的几套并起来跑。
  windows-core:
    # core 一家就占了整格的九成墙钟 ⇒ 单独拎出来再分三片,三片并行。
    name: cargo test core(Windows · ${{ matrix.shard.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false # ⛔ 一片红别掐掉另外两片:三片的红各是独立信息
      matrix:
        # ⭐ 这三片是一个「完全划分」,不是抽样(540 当场证过:零重叠 + 计数相加等于全量)。⛔ 改动这三条过滤串就把下面四行重跑一遍,
        #    数对不上就是有测试没人跑了:
        #      cd core && cargo test --lib -- --list | grep -c ": test$"                       → 全量
        #      …| grep ": test$" | grep -c "sync::"   /   …| grep -c "backup::"   /   …| grep -v "sync::" | grep -v "backup::" | wc -l
        #      三数相加 == 全量,且 `grep "sync::" | grep "backup::"` 一条不中。
        # ⚠ 第三片用 `--skip` 取前两片的补集 ⇒ 新增的模块自动落进第三片,不会漏跑(漏跑的失灵方式是安静的绿,多跑只是慢一点)。
        shard:
          - name: sync
            args: "sync::"
          - name: backup
            args: "backup::"
          - name: 其余
            args: "-- --skip sync:: --skip backup::"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          # 三片共用同一份缓存键(同一个 crate、同一套依赖),互不覆盖。
          shared-key: win-core

      # ⛔ 别把 `cargo test` 直接当判据:分片靠给 libtest 传过滤串,过滤串打错一个字 = `0 passed` + 退出码 0 = 这一格绿着却一只测试都没跑
      #    (`lib/test-verdict.mjs` 头注的第 ② 种 fail-open)⇒ 走 `cargo-verdict.mjs`:`passed === 0` 判 `unknown`(退 2),不是绿。
      # ⚠ 重定向到文件再判,别管道接 tail/head(会吞掉真实退出码,memory `test-output-pipe-loses-exit-code`)。
      - name: core 分片 ${{ matrix.shard.name }}
        shell: bash
        run: |
          set -uo pipefail
          cd core
          rc=0
          cargo test --quiet ${{ matrix.shard.args }} > "$RUNNER_TEMP/core.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/core.log"
          node ../scripts/cargo-verdict.mjs "$RUNNER_TEMP/core.log" \
            --status="$rc" --label="core · ${{ matrix.shard.name }}(Windows)"

  windows-rest:
    # 除 core 外的五套,合计约 5 分钟(540 实测,大头是各自的编译)。
    name: cargo test 五套(Windows · core 以外)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            sync-proto
            src-tauri
            android/src-tauri
            mobile

      # ⚠ `server` 含真时间短 TTL 集成测、`mobile` 含起真同步服务的端到端集成测 ⇒ 这一格刻意串行,别为省墙钟并发它们(448 立,540 原样保留)。
      # ⚠ 同 `shells` 那格:刻意不跑 `npm run build`(`cargo test` 不开 `custom-protocol` ⇒ 走 devUrl,`dist/` 缺席照样编得过)。
      - name: 五套(串行)
        shell: bash
        run: |
          set -uo pipefail
          for c in server sync-proto src-tauri android/src-tauri mobile; do
            echo "── $c"
            rc=0
            (cd "$c" && cargo test --quiet) > "$RUNNER_TEMP/rest.log" 2>&1 || rc=$?
            cat "$RUNNER_TEMP/rest.log"
            node scripts/cargo-verdict.mjs "$RUNNER_TEMP/rest.log" \
              --status="$rc" --label="$c(Windows)" || exit $?
          done

  # ⭐⭐ 540 立:调用方唯一该看的那一格。调用方 `needs: preflight` 等的是这份 reusable workflow 的全部 job:红 / 取消会让调用 job 失败,
  #    但内部 job 被 `skipped` 时调用 job 仍可能报 success ⇒ 门禁没跑完而产物照发 —— 「一道被跳过的门禁和一道通过的门禁在 job 那格上长得一样」。
  # ⚠⚠ 如实记:这个洞今天够不着 —— 本文件的 job 一个 `if:` 都没有,两条 release workflow 调它也不带 `if:`;这是结构性保险不是修活缺陷,
  #    ⛔ 别读成「曾经发过一次事故」。它防的是将来有人给某一格加 `if:` 时那扇门安静地开 ⇒ 把「全绿」从默认语义变成一条显式断言。
  all-green:
    name: 全绿汇总(⛔ 调用方只认这一格)
    if: always() # ⛔ 必须 always:默认语义下上游一红这格自己就被 skip,那就白设了
    needs: [preflight, shells, windows-core, windows-rest]
    runs-on: ubuntu-latest
    steps:
      - name: 逐格断言 success(⛔ skipped / cancelled 一律不算绿)
        run: |
          set -euo pipefail
          fail=0
          # ⭐ 断的是 `== success`,**不是 `!= failure`** —— 后者会把 skipped 与 cancelled 放过去,
          #    而那正是本格存在的全部理由。
          for pair in \
            "preflight=${{ needs.preflight.result }}" \
            "shells=${{ needs.shells.result }}" \
            "windows-core=${{ needs.windows-core.result }}" \
            "windows-rest=${{ needs.windows-rest.result }}"; do
            name="${pair%%=*}"; got="${pair#*=}"
            if [ "$got" = "success" ]; then
              echo "  ✅ $name = $got"
            else
              echo "  ❌ $name = $got（要 success）"
              fail=1
            fi
          done
          test "$fail" -eq 0
