name: preflight

# ⭐ 385 立:**发版闸**。tag(桌面 `v*` / 安卓 `android-v*`)是自动发给真实用户的边界,
# 而在此之前这个边界前面没有任何机器门槛——五套 cargo test 与十道发版门禁全靠人在本地
# 记得跑。实测:十道门禁全跑 **2.7 秒**、共享那三套 cargo test 约 3 分钟。
# 单人项目可以没有 PR CI;**自动发布边界不可以没有刹车**。
#
# 它由两条 release workflow 用 `uses:` 调用(reusable workflow,**两处零抄写**——
# 复制两份正是这一轮在批评的那类腐烂点)。也可以 `workflow_dispatch` 手动跑一趟,
# 用来验证「这些门禁与测试在 Linux runner 上跑得起来」——它们原本只在作者的 Windows
# 本机跑过。⭐ 十道门禁 385 已这样探过两趟(第一趟红在白名单漏了 `docs/ui-guidelines.md`,
# 加白名单后第二趟全绿);386 的 `shells` 格也这样探过一趟(run 31887693994,首趟即绿,
# 两壳的数与 Windows 逐个相同 —— ⚠ **那是 386 当时的读数,不是当前态**,别拿它对今天的数)。
# **改了门禁或本文件之后照旧先探一趟,别拿发版当首测。**
#
# ⭐ 386 补上第二格 `shells`:两只壳 crate 的 cargo test(468/OH-d 抽出共享的 `mobile/` 之后
# 是三格)。它们守的是**壳装配契约**(单实例门 / 设备身份保持 / 坏库版本拒绝 / 主库丢失保护),
# 此前不在任何 CI 里 —— 385 把它记成可优化项时,五套里恰好漏掉的就是这两套。两格**并行**跑,
# 故 preflight 的墙钟 = 两格里慢的那个,不是相加。
#
# ⛔ **518 起:job 名与注释里一律不写「跑出来多少支」那种数**(backlog 测试与工装 31)——
# job 名在 job 起来之前就要定,拿不到运行期读数;写死的那个数会静静腐烂,而它正是 Actions
# 页面上第一眼看见的那行字(同 memory `stale-number-in-docs-and-fixtures`)。⭐ 但**「跑几套」
# 这类结构数照留**(「三套」「六套」「十道」):它们数的是紧接在下面那几行 `run:`,
# 改本文件才会变,不会背着人腐烂。
#
# ⭐ 448 补上第三格 `windows`(ci-plan 阶段 2)。**在此之前,CI 里从来没有一条 Rust 测试
# 在 Windows 上跑过** —— 上面两格都钉死 `ubuntu-22.04`,nightly 的 Windows 那格只 build
# 不 test,而 **Windows 是今天唯一的生产桌面端**。425 那支缺陷正好长在这个洞里:
# `restore.rs` 落位前那次 fsync 拿的是只读句柄,Unix 上对 `O_RDONLY` 合法、而 Windows 的
# `FlushFileBuffers` 直接 `ERROR_ACCESS_DENIED` ⇒ **恢复在生产端根本落不了位**,形状是
# 「core 8 支全红」;`windows-latest` 上一格 `cargo test` 当场就抓得住,实际却是靠人工
# 复跑一整轮才抓到的,而**设计审与实现审都读不出平台 API 语义差**。
# ⚠ 它落在 preflight 里 ⇒ **每次发版都会等这一格**(墙钟 +5~10 分钟)。那是有意的:
# 发版闸正是这个洞最该被堵上的地方。
# ⚠ 两端 core 的**测试条数本来就不同**(backup 模块有多处 `#[cfg(unix)]` 测试,Linux 恒多
# 那几支)—— 这里只判过不过,⛔ 别去对数,也别在这儿写下当时的读数(写下就腐烂)。
#
# ⛔ 刻意**不**放进来的两样(判据见 progress-log 385/386):
#   · e2e —— 要 Windows + 真 WebView2 + 先停掉占全局热键的生产实例,塞进来产的是
#     环境噪声而不是发布判据;
#   · check-deployed-drift —— 它问的是**线上**,要网络 + ssh,且在发版**前**问没有意义。

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  preflight:
    name: cargo test 三套 + 十道门禁
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            server
            sync-proto
      # 与 nightly.yml 同口径的三套(两壳那两套在下面的 `shells` 格,386 起)。
      - run: cd core && cargo test --quiet
      - run: cd server && cargo test --quiet
      - run: cd sync-proto && cargo test --quiet

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      # 只有 check-filter-parity 要 esbuild;其余九道只用 node 内置 + scripts/lib。
      - run: npm ci

      - name: 十道发版门禁(清单以 CLAUDE.md「怎么跑」为准)
        run: |
          set -euo pipefail
          for g in lock-drift theme-drift contrast hardcoded-colors timing-drift \
                   radius-drift fs-drift filter-parity hit-zone i18n-drift; do
            echo "── check-$g"
            node "scripts/check-$g.mjs"
          done

  # 386:两壳的 cargo test。与上面那格**互不依赖**,同时开跑。
  shells:
    name: cargo test 三格(桌面壳 / 安卓壳 / 共享手机层)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # 两壳都是 tauri crate,Linux 上编它要 webkit2gtk 一套(与 release.yml 的 Linux
      # 那格逐字同一串;缺了会停在 pkg-config 找不到 webkit2gtk-4.1)。
      # ⚠ 安卓壳这里编的是 **host target(x86_64-linux)**——跑的是纯 Rust 单测与起真
      # 同步服务的集成测,**不需要 NDK**(NDK 只在真出 aarch64 的 .so 时才要)。
      # ⭐ 518 补上步级上限(ci-plan §8-9 记的那笔:「谁下次碰 preflight 顺手加一行即可」)。
      # 450 那天 main 上这一步与 `ci.yml` 的 `linux-e2e`(同样装 apt 的那格)**一起卡在
      # `apt-get` 上 52 分钟**,而同趟不装 apt 的两格早绿了 ⇒ 是 runner 的 apt 镜像挂住、
      # 不是我们的树。不设上限的话它会一路吃掉 job 的默认 360 分钟,最后报成一次说不清的红
      # ——**把一次基础设施事件呈现成一次发版被卡**。15 分钟对正常 apt(实测 ~60 秒)绰绰有余。
      - name: Linux 系统依赖(Tauri v2)
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            android/src-tauri
            mobile

      # ⚠ 刻意**不**跑 `npm run build`:`dist/` 是 gitignore 的,CI 检出里没有,但
      # `generate_context!` 只有在开了 `custom-protocol` 特性时才去嵌 `frontendDist`
      # (tauri-macros:`dev: cfg!(not(feature = "custom-protocol"))`),而 cargo test
      # 不开它 ⇒ 走 devUrl 那支,`dist/` 缺席照样编得过。别顺手补一步前端构建。
      - run: cd src-tauri && cargo test --quiet
      - run: cd android/src-tauri && cargo test --quiet
      # OH-d/D1:两只手机壳共用的那一层(coord + 93 条命令面 + 启动装配)搬来了这里。
      # ⚠ 它含**起真同步服务的「加入空间」端到端集成测**(随源自 android/src-tauri),
      # 别与重负载并行。
      - run: cd mobile && cargo test --quiet

  # 448(ci-plan 阶段 2):**全套在 Windows 上再跑一遍**(OH-d/D1 起是六套)。
  # 与上面两格互不依赖,三格同时开跑。
  #
  # ⛔ **不在这一格跑那十道门禁**:它们是平台无关的 node 脚本(判的是仓里几份表对不对得上),
  #    在第二个操作系统上跑一遍不产生任何新判据,只是把墙钟拉长。这一格要的是**平台 API 语义**。
  # ⚠ **不拆成两格**(Linux 那边拆是因为 `shells` 要先 apt 装 webkit2gtk 一套):Windows 上
  #    WebView2 是镜像预装的,没有那步 ⇒ 拆开只是多付一次检出 + rust-cache 还原。
  # ⚠ 安卓壳这里同样编的是 **host target(x86_64-windows)**,跑纯 Rust 单测,**不需要 NDK**。
  windows:
    name: cargo test 六套(Windows,唯一的生产桌面端)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            server
            sync-proto
            src-tauri
            android/src-tauri
            mobile

      # 与 Linux 那两格同口径的六套。⚠ `core` 含起真同步服务器的双库端到端集成测、
      # `server` 含真时间短 TTL 集成测,故这一格刻意串行跑,别为省墙钟并发它们。
      - run: cd core && cargo test --quiet
      - run: cd server && cargo test --quiet
      - run: cd sync-proto && cargo test --quiet
      # ⚠ 同 `shells` 那格:刻意**不**跑 `npm run build`,`cargo test` 不开 `custom-protocol`
      # ⇒ 走 devUrl 那支,`dist/` 缺席照样编得过。
      - run: cd src-tauri && cargo test --quiet
      - run: cd android/src-tauri && cargo test --quiet
      - run: cd mobile && cargo test --quiet
