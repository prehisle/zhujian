[package]
name = "zhujian-android"
version = "0.3.37"
description = "朱简安卓端(119 起全功能主力端;android-plan/phone-space-plan)——tauri 壳;数据层与同步全在共享 crate zhujian-core"
authors = ["prehisle"]
license = ""
edition = "2021"
# 与 path 依赖 zhujian-core 对齐(core 的 WriterLease 用 1.89 稳定化的 File::try_lock;
# 声明必须真实——低于 1.89 本就编不过)。
rust-version = "1.89"

# 沿用「sibling crate 不建 workspace」纪律(各自 target/ 与 Cargo.lock;本 lock 已在
# scripts/check-lock-drift.mjs 门禁内——关键协议/密码学 crate 版本与桌面漂移会静默破协议,
# android-plan §1 M5)。

[lib]
name = "app_lib"
# cdylib 供 Android 出 .so;staticlib/rlib 供桌面 dev(本机跑诊断页快检)。
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 验收工装(不发版):开 WebView 远程调试通道(Chrome DevTools 协议),默认关。
# 发版包不带此 feature => WebView 不可被任意调试(安全)。验收时
# `npx tauri android build --apk --target aarch64 --features devtools` 出可调试包,
# 配 adb forward + CDP 精确点击/DOM 断言(见 scripts/android-cdp.mjs);发版仍用干净包。
devtools = ["tauri/devtools"]
# **台架专用**(305 真机复验,验完即撤):把 core 的 ops 供流埋点打开,经
# tauri-plugin-log 直达 logcat(`adb logcat -s P305`)。默认关、发版包不带。
probe305 = ["zhujian-core/probe305"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
# 真机排障锚:Rust 侧 log::info 直达 logcat(探针工程同款;release 也装,屏幕小靠 adb 看)。
tauri-plugin-log = "2"
# ⚠ **直接依赖它只为 `probe305` 那个 feature 转发**(命令面本身经 zhujian-mobile 用它)。
zhujian-core = { path = "../../core" }
# ⭐ OH-d/D1 起:空间协调器 + 93 条命令面 + 启动装配都在这里,与鸿蒙壳同一份源码。
# ⛔ 它按 crates.io 声明 tauri —— 别在那边钉死 git 源(判据在 mobile/Cargo.toml 那一行头注)。
zhujian-mobile = { path = "../../mobile" }
# rustls 0.23 须恰好一个加密提供者(ring 特性由 core 钉死);壳层职责 = run() 启动时
# install_default,不装则首次 wss:// 在 ClientConfig::builder() panic(84 真机踩过,
# android-plan §1 M2 要求安卓壳照桌面做)。
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# 106 半自动更新:拉 android.json 的最小阻塞式 HTTP 客户端(spawn_blocking 里跑;
# rustls+webpki-roots,TLS 走启动时装好的 ring 提供者,不引 aws-lc)。
ureq = { version = "2", features = ["json"] }
# 106「下载」跳系统浏览器。
tauri-plugin-opener = "2"
# 截止提醒的手机那半(用户面 39①):每天到点一条系统通知。桌面壳同款依赖。
# ⛔ **鸿蒙壳刻意不带它**(前端那侧由 `HAS_NOTIFICATION=false` 把整节摘掉)。
tauri-plugin-notification = "2"

# 107 扫码配对:官方扫码插件,移动端专属(桌面 dev 构型不编它,代码 cfg(mobile) 守)。
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

# ⛔ **没有 [dev-dependencies]**:唯一那条(起真同步服务的「加入空间」集成测)
# 随 coord.rs 一起搬进了 `mobile/`(OH-d/D1)。
