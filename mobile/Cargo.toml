[package]
name = "zhujian-mobile"
version = "0.1.0"
description = "朱简两只手机壳(安卓 / 鸿蒙)共用的壳层:空间协调器 + 命令面 + 启动装配。数据层与同步仍全在 zhujian-core"
authors = ["prehisle"]
license = ""
edition = "2021"
# 与 path 依赖 zhujian-core 对齐(core 的 WriterLease 用 1.89 稳定化的 File::try_lock)。
rust-version = "1.89"

# 沿用「sibling crate 不建 workspace」纪律(各自 target/ 与 Cargo.lock)。
# ⚠ 本 lock 是第七份,已进 scripts/check-lock-drift.mjs。

[lib]
name = "zhujian_mobile"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
# ⭐⭐ **这一行是整只 crate 的承重处,别改成 git 依赖**:它按 crates.io 声明,
# 于是**在哪一端解析成哪一份 tauri,由那一端自己的 `[patch.crates-io]` 说了算** ——
# 安卓那边解析成 crates.io 的 tauri 2.x,鸿蒙那边被 patch 成 richerfu 那条 fork。
# `#[tauri::command]` 宏体里写死的根路径是字面量 `::tauri`(tauri-macros 的
# `WrapperAttributes::root` 默认值),它认的就是本 crate 这个名字的依赖。
# ⛔ 若哪天在这里钉死某一条 git 源,鸿蒙壳会同时链进**两份** tauri,
# 报的是 `State<'_, Coord>` 类型对不上,与依赖表看不出关系。
tauri = { version = "2", features = [] }
# 共享核心:数据层(items/oplog/HLC/35 条迁移)+ 同步客户端侧,与桌面逐字节同一套。
zhujian-core = { path = "../core" }
# 壳层直接用到的底座(版本声明与 core 一致,同一 lock 内解析成同一实例)。
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
# 传输任务的控制通道(mpsc)与写通知(Notify);运行时仍是各壳的 tauri async_runtime。
tokio = { version = "1", features = ["sync"] }
# 图片字节 → data: URL 过 IPC(与桌面壳同版)。
base64 = "0.22"

[dev-dependencies]
# 「加入空间」集成测(space-entry-plan §7):起真同步服务(随机端口),源端创号
# 出码 → coord.join_space 全程(配对→staging 引导→publish→集成)。与 core 同款。
zhujian-syncd = { path = "../server" }
